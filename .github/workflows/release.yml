name: Release

# GitHub Actions tag filters use glob syntax, not regular expressions. This broad
# filter starts likely version tags; release-validate strictly refuses every
# non-vMAJOR.MINOR.PATCH lookalike before packaging or publishing.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to recover or rerun (for example v0.1.0)
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release:
    name: macOS arm64 release, Xcode 16.4
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      BUNDLE_BUILD: ${{ github.run_number }}
    steps:
      - name: Validate recovery tag input
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

      # Keep release tooling at the workflow commit. This is deliberately
      # separate from recovery source, which may predate that tooling.
      - name: Check out workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: release-tools

      - name: Check out tagged release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          path: release-source

      - name: Assert isolated checkout commits
        run: |
          set -eu
          test "$(git -C release-tools rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C release-source rev-parse "$RELEASE_TAG^{commit}")" = "$(git -C release-source rev-parse HEAD)"

      - name: Assert arm64 runner and pinned toolchain
        run: |
          set -eu
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version

      - name: Validate source and test
        working-directory: release-source
        run: |
          set -eu
          make validate-release
          make check

      - name: Package release assets
        working-directory: release-source
        run: make package

      - name: Verify tagged release assets and notes
        run: |
          set -eu
          version=$(tr -d '\r\n' < release-source/VERSION)
          test "$RELEASE_TAG" = "v$version"
          zip="release-source/dist/UsageMenu-$version-universal-adhoc.zip"
          pkg="release-source/dist/UsageMenu-$version-universal-unsigned.pkg"
          sums=release-source/dist/SHA256SUMS
          test -f "$zip" && test -f "$pkg" && test -f "$sums"
          test "$(find release-source/dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          (cd release-source/dist && shasum -a 256 -c SHA256SUMS)
          release-tools/bin/release-notes "$version" release-source/CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
          ! gh release view "$RELEASE_TAG" >/dev/null 2>&1 || { echo "REFUSING: release already exists" >&2; exit 1; }

      - name: Publish GitHub release
        run: |
          set -eu
          version=$(tr -d '\r\n' < release-source/VERSION)
          test "$RELEASE_TAG" = "v$version"
          gh release create "$RELEASE_TAG" \
            "release-source/dist/UsageMenu-$version-universal-adhoc.zip" \
            "release-source/dist/UsageMenu-$version-universal-unsigned.pkg" \
            release-source/dist/SHA256SUMS \
            --title "Usage Menu $version" --notes-file RELEASE_NOTES.md
